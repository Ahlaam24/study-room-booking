<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Room Booking - University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 Study Room Booking</h1>
            <p class="subtitle">Reserve your perfect study space</p>
        </div>
    </header>

    <main class="container">
        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="rooms">Available Rooms</button>
            <button class="tab-btn" data-tab="bookings">My Bookings</button>
        </nav>

        <!-- Available Rooms Section -->
        <section id="rooms-section" class="tab-content active">
            <div class="filter-bar">
                <select id="capacity-filter">
                    <option value="all">All Capacities</option>
                    <option value="2">2 people</option>
                    <option value="4">4 people</option>
                    <option value="6">6 people</option>
                    <option value="8">8+ people</option>
                </select>
                <input type="date" id="date-filter" min="">
                <input type="time" id="time-filter">
                <button class="btn-secondary" id="clear-filters">Clear Filters</button>
            </div>

            <div class="rooms-grid" id="rooms-grid">
                <!-- Rooms will be dynamically generated -->
            </div>
        </section>

        <!-- My Bookings Section -->
        <section id="bookings-section" class="tab-content">
            <div id="bookings-list">
                <!-- Bookings will be dynamically generated -->
            </div>
            <div id="no-bookings" class="empty-state" style="display: none;">
                <p>You don't have any bookings yet.</p>
                <p>Start by booking a room from the "Available Rooms" tab!</p>
            </div>
        </section>
    </main>

    <!-- Booking Modal -->
    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Book Study Room</h2>
            <div id="modal-room-info"></div>
            <form id="booking-form">
                <div class="form-group">
                    <label for="booking-date">Date:</label>
                    <input type="date" id="booking-date" required min="">
                </div>
                <div class="form-group">
                    <label for="booking-time">Start Time:</label>
                    <input type="time" id="booking-time" required>
                </div>
                <div class="form-group">
                    <label for="booking-duration">Duration:</label>
                    <select id="booking-duration" required>
                        <option value="1">1 hour</option>
                        <option value="2">2 hours</option>
                        <option value="3">3 hours</option>
                        <option value="4">4 hours</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="student-name">Your Name:</label>
                    <input type="text" id="student-name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="student-id">Student ID:</label>
                    <input type="text" id="student-id" required placeholder="Enter your student ID">
                </div>
                <button type="submit" class="btn-primary">Confirm Booking</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
